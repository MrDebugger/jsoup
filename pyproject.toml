[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jsoup"
version = "0.1.0"
description = "Convert JSON to BeautifulSoup HTML/XML structures"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    {name = "Ijaz Ur Rahim", email = "ijazkhan095@gmail.com"},
]
keywords = ["parser", "html", "bs4", "BeautifulSoup", "soup", "jsoup", "json", "builder"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "beautifulsoup4>=4.9.3",
]

[project.urls]
Homepage = "https://github.com/MrDebugger/jsoup"
